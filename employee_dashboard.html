<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Security Status - Nexora Retail</title>
<style>
  body {
    margin: 0; min-height: 100vh; background: #f4f5f7; font-family: -apple-system, "Segoe UI", sans-serif; color: #22282f;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 32px 20px 60px; }
  .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
  .top h1 { font-size: 18px; margin: 0; }
  .top a { font-size: 13px; color: #b91c1c; text-decoration: none; }

  .card { background: white; border-radius: 10px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); padding: 22px; margin-bottom: 16px; }

  .status-card { display: flex; align-items: center; gap: 16px; }
  .status-dot { width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; }
  .status-text h2 { margin: 0 0 4px 0; font-size: 16px; }
  .status-text p { margin: 0; font-size: 13px; color: #6b7280; }

  .card h3 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.03em; color: #6b7280; margin: 0 0 12px 0; }
  .row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #f0f1f3; font-size: 13.5px; }
  .row:last-child { border-bottom: none; }
  .row .label { color: #6b7280; }
  .row .value { font-weight: 500; }

  .breach-item { background: #f9fafb; border-radius: 6px; padding: 10px 12px; margin-bottom: 8px; font-size: 13px; }
  .breach-item strong { display: block; margin-bottom: 2px; }
  .breach-item .meta { color: #6b7280; font-size: 12px; }

  .action-btn { display: inline-block; background: #0c447c; color: white; padding: 9px 16px; border-radius: 6px; text-decoration: none; font-size: 13px; font-weight: 500; margin-top: 8px; }

  .empty { text-align: center; color: #6b7280; padding: 40px 20px; font-size: 14px; }
  .loading { text-align: center; color: #9aa1ab; padding: 60px 20px; }
</style>
</head>
<body>

<div class="wrap" id="app">
  <div class="loading">Loading your status...</div>
</div>

<script>
const API_BASE = "http://localhost:8001";

function severityColor(sev) {
  return { Critical: "#c0152f", High: "#c2660a", Medium: "#97730a", Low: "#1a7a42" }[sev] || "#6b7280";
}
function severityMessage(sev) {
  return {
    Critical: "Action needed right away",
    High: "Action recommended soon",
    Medium: "Worth a look when you can",
    Low: "You're in good shape",
  }[sev] || "Status unknown";
}

async function load() {
  const app = document.getElementById("app");

  const sessionRes = await fetch(`${API_BASE}/auth/session`, { credentials: "include" });
  const session = await sessionRes.json();
  if (!session.signed_in) {
    app.innerHTML = `<div class="card empty">You're not signed in. <a href="${API_BASE}/auth/login">Sign in with Google</a> to view your status.</div>`;
    return;
  }

  const res = await fetch(`${API_BASE}/api/my-status`, { credentials: "include" });
  const data = await res.json();

  let html = `
    <div class="top">
      <h1>My Security Status</h1>
      <a href="${API_BASE}/auth/logout">Sign out</a>
    </div>
  `;

  if (!data.found) {
    html += `<div class="card empty">
      <p>${data.message}</p>
      <p style="font-size:12.5px;">Your account hasn't been assessed yet. Check back after your organization's next scan, or check your password directly below.</p>
      <a class="action-btn" href="${API_BASE}/portal">Check my password</a>
    </div>`;
    app.innerHTML = html;
    return;
  }

  html += `
    ${data.password_reset_required ? `
      <div class="card" style="border: 2px solid #c0152f; background: #fef2f2;">
        <h3 style="color:#c0152f; margin-top:0;">\u26a0 Action required: set a new password</h3>
        <p style="font-size:13.5px; margin-bottom:12px;">Your security team has flagged your account and requires you to set a new password before continuing. This does not affect your Google sign-in.</p>
        <a class="action-btn" href="${API_BASE}/portal">Set my new password now</a>
      </div>
    ` : ""}
    <div class="card status-card">
      <div class="status-dot" style="background:${severityColor(data.severity)};"></div>
      <div class="status-text">
        <h2>${severityMessage(data.severity)}</h2>
        <p>Signed in as ${data.email}</p>
      </div>
    </div>

    <div class="card">
      <h3>What we found</h3>
      <div class="row"><span class="label">Email in known breaches</span><span class="value">${data.signals.email_breached ? "Yes" : "No"}</span></div>
      <div class="row"><span class="label">Password checked</span><span class="value">${data.password_checked ? "Yes" : "Not yet"}</span></div>
      ${data.password_checked ? `<div class="row"><span class="label">Password status</span><span class="value">${data.signals.password_reused ? "Unsafe - please change it" : "Looks safe"}</span></div>` : ""}
      ${!data.password_checked ? `<a class="action-btn" href="${API_BASE}/portal">Check my password now</a>` : ""}
    </div>
  `;

  if (data.breach_detail && data.breach_detail.length) {
    html += `<div class="card"><h3>Breaches your email appeared in</h3>`;
    data.breach_detail.forEach(b => {
      html += `<div class="breach-item">
        <strong>${b.name}</strong>
        <span class="meta">${b.date} \u00b7 Exposed: ${b.exposed_data}</span>
      </div>`;
    });
    html += `</div>`;
  }

  html += `
    <div class="card">
      <h3>Recommended action</h3>
      <p style="font-size:13.5px; margin:0;">${data.recommendation}</p>
    </div>
  `;

  if (data.recent_logins && data.recent_logins.length) {
    html += `<div class="card"><h3>Your recent sign-ins</h3>`;
    data.recent_logins.forEach(l => {
      html += `<div class="row"><span class="label">${l.created_at}</span><span class="value">${l.login_location || "Unknown"}, ${l.login_hour}:00</span></div>`;
    });
    html += `</div>`;
  }

  app.innerHTML = html;
}

load();
</script>

</body>
</html>
